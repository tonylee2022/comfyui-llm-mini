# Copy this file to config.ini and configure the providers you want to use.
# 将此文件复制为 config.ini，并配置您要使用的模型提供商。
#
# Built-in Providers / 内置模型提供商列表:
# - openai, codex, google, xai, claude, deepseek, qwen, moonshot, siliconflow, openrouter, ollama
#
# If you want to hide a provider from the ComfyUI node panel, simply comment out 
# its configuration block using '#' or delete the corresponding lines.
# 如果您不想在 ComfyUI 节点面板中显示某个提供商，只需使用 '#' 注释掉该提供商的配置块，或者直接删除相关的配置行。
#
# Supported SDK Backends / 支持的 SDK 后端:
# - OpenAI Compatible / OpenAI 兼容接口 (backend = openai_compatible, default/默认)
# - Anthropic SDK (Claude) / Anthropic 接口 (backend = anthropic)
#
# For built-in providers, base_url is optional as default endpoints are preset.
# For custom providers (e.g. minimax, local proxies), base_url is required.
# 对于内置提供商，base_url 是可选的（已内置默认接口地址）。
# 对于自定义提供商（如 minimax、本地代理等），必须填写 base_url。

[provider.openai]
api_key = 
base_url = https://api.openai.com/v1/
default_model = gpt-5.5
default_models = gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-4.1-mini, gpt-4o-mini

[provider.codex]
default_model = gpt-5.3-codex
default_models = gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-5.3-codex, gpt-5.3-codex-spark

[codex_oauth]
client_id = 
client_secret = 
access_token = 
refresh_token = 
token_expires_at = 0
token_url = https://auth.openai.com/oauth/token

[provider.google]
api_key = 
base_url = 
default_model = gemini-3.5-flash
default_models = gemini-3.5-flash, gemini-3.1-pro-preview, gemini-3-flash-preview

[provider.xai]
api_key = 
base_url = https://api.x.ai/v1/
default_model = grok-4.3
default_models = grok-4.3, grok-4.20-0309-reasoning, grok-4.20-0309-non-reasoning

[xai_oauth]
client_id = 
client_secret = 
access_token = 
refresh_token = 
token_expires_at = 0
token_url = https://auth.x.ai/oauth2/token

[provider.claude]
api_key = 
base_url = https://api.anthropic.com/
default_model = claude-sonnet-4-6
default_models = claude-sonnet-4-6, claude-opus-4-7

[provider.deepseek]
api_key = 
base_url = https://api.deepseek.com/v1/
default_model = deepseek-v4-flash
default_models = deepseek-v4-flash, deepseek-v4-pro

[provider.qwen]
api_key = 
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1/
default_model = qwen-plus
default_models = qwen-plus, click Refresh Models

[provider.moonshot]
api_key = 
base_url = https://api.moonshot.cn/v1/
default_model = moonshot-v1-8k
default_models = moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k

[provider.siliconflow]
api_key = 
base_url = https://api.siliconflow.cn/v1/
default_model = click Refresh Models
default_models = click Refresh Models

[provider.openrouter]
api_key = 
base_url = https://openrouter.ai/api/v1/
default_model = click Refresh Models
default_models = click Refresh Models

# Custom Anthropic-compatible provider example: MiniMax
# 自定义 Anthropic 兼容提供商示例：MiniMax
[provider.minimax]
api_key = 
base_url = https://api.minimaxi.com/anthropic
default_model = MiniMax-M2.7
default_models = MiniMax-M2.7
backend = anthropic

# Custom OpenAI-compatible provider example: Local Proxy
# 自定义 OpenAI 兼容提供商示例：本地代理
[provider.local_proxy]
display_name = Local Proxy
api_key = 
base_url = http://127.0.0.1:3000/v1/
default_model = 
default_models = click Refresh Models

# Built-in Ollama configuration template (commented out by default)
# 内置 Ollama 配置项模板（默认注释关闭）
