# Copy this file to config.ini and configure the providers you want to use.
# 将此文件复制为 config.ini，并配置您要使用的模型提供商。
#
# Built-in Providers / 内置模型提供商列表:
# - openai, codex, google, xai, claude, deepseek, qwen, moonshot, siliconflow, openrouter, ollama, llama_cpp
#
# If you want to hide a provider from the ComfyUI node panel, simply comment out 
# its configuration block using '#' or delete the corresponding lines.
# 如果您不想在 ComfyUI 节点面板中显示某个提供商，只需使用 '#' 注释掉该提供商的配置块，或者直接删除相关的配置行。
#
# Supported SDK Backends / 支持的 SDK 后端:
# - OpenAI Compatible / OpenAI 兼容接口 (backend = openai_compatible, default/默认)
# - Anthropic SDK (Claude) / Anthropic 接口 (backend = anthropic)
#
# For built-in providers, base_url is optional as default endpoints are preset.
# For custom providers (e.g. MiniMax or other third-party services), base_url is required.
# 对于内置提供商，base_url 是可选的（已内置默认接口地址）。
# 对于自定义提供商（如 MiniMax 或其他第三方服务），必须填写 base_url。
#
# Provider capability switches:
# supports_chat controls whether the provider appears in the API Chat node.
# supports_image/supports_video are available for provider manager metadata.
# 提供商能力开关：
# supports_chat 控制该提供商是否出现在 API Chat 节点。
# supports_image/supports_video 用于提供商管理器能力元数据。

[provider.openai]
api_key = 
base_url = https://api.openai.com/v1/
default_model = gpt-5.5
default_models = gpt-5.5, gpt-5.4, gpt-5.4-mini, gpt-4.1-mini, gpt-4o-mini
supports_chat = true
supports_image = true
supports_video = false

[provider.codex]
default_model = gpt-5.6-sol
default_models = gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5, gpt-5.4, gpt-5.4-mini
supports_chat = true
supports_image = true
supports_video = false

[codex_oauth]
client_id = 
client_secret = 
access_token = 
refresh_token = 
token_expires_at = 0
token_url = https://auth.openai.com/oauth/token

[provider.google]
api_key = 
base_url = 
default_model = gemini-3.5-flash
default_models = gemini-3.5-flash,gemini-3.1-pro-preview,gemini-3-flash-preview,gemini-2.5-flash,gemma-4-31b-it
supports_chat = true
supports_image = true
supports_video = false

[provider.xai]
api_key = 
base_url = https://api.x.ai/v1/
default_model = grok-build-0.1
default_models = grok-build-0.1,grok-4.3, grok-4.20-0309-reasoning, grok-4.20-0309-non-reasoning
supports_chat = true
supports_image = true
supports_video = true

[xai_oauth]
client_id = 
client_secret = 
access_token = 
refresh_token = 
token_expires_at = 0
token_url = https://auth.x.ai/oauth2/token

[provider.claude]
api_key = 
base_url = https://api.anthropic.com/
default_model = claude-sonnet-4-6
default_models = claude-opus-4-8,claude-sonnet-4-6,claude-haiku-4-5-20251001

[provider.deepseek]
api_key = 
base_url = https://api.deepseek.com/v1/
default_model = deepseek-v4-flash
default_models = deepseek-v4-flash, deepseek-v4-pro

[provider.qwen]
api_key = 
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1/
default_model = qwen3.7-plus
default_models = qwen3.7-max-preview,qwen3.7-plus,qwen3.6-flash,qwen3.6-plus

[provider.moonshot]
api_key = 
base_url = https://api.moonshot.cn/v1/
default_model = kimi-k2.6
default_models = kimi-k2.6,kimi-k2.5

[provider.siliconflow]
api_key = 
base_url = https://api.siliconflow.cn/v1/
default_model = click Refresh Models
default_models = click Refresh Models

[provider.openrouter]
api_key = 
base_url = https://openrouter.ai/api/v1/
default_model = click Refresh Models
default_models = click Refresh Models

[provider.minimax]
api_key = 
base_url = https://api.minimaxi.com/anthropic
default_model = MiniMax-M3
default_models = MiniMax-M3, MiniMax-M2.7
backend = anthropic

# Built-in Ollama configuration template
# 内置 Ollama 配置项模板
[provider.ollama]
base_url = http://127.0.0.1:11434/v1/
auth_type = none
default_model = click Refresh Models
default_models = click Refresh Models

[provider.llama_cpp]
auth_type = none
backend = llama_cpp
default_model = click Refresh Models
default_models = click Refresh Models
supports_chat = true
supports_image = true
supports_video = true

[llama_cpp]
# Leave executable empty to discover the plugin-private runtime first, then PATH.
# 留空 executable 时优先使用节点目录内的私有运行时，其次从 PATH 查找。
executable =
# Leave models_dir empty to use ComfyUI/models/LLM.
# 留空 models_dir 时使用 ComfyUI/models/LLM。
models_dir =
context_size = 32768
n_gpu_layers = 999
# Per-model overrides are managed from Provider Manager and stored automatically
# in model_configs. Usually this option should not be edited manually.
# 单模型覆盖由 Provider Manager 自动维护，通常不需要手工编辑 model_configs。
# model_configs = {}
models_max = 1
default_unload_policy = after_run
idle_unload_seconds = 600
comfy_memory_policy = auto
