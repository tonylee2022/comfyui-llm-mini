[project]
name = "comfyui-llm-mini"
description = "A lightweight ComfyUI custom node pack for cloud LLM providers, OAuth/subscription access, personas, image generation, and xAI video."
version = "0.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.57.4",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.urls]
Repository = "https://github.com/TonyLee/comfyui-llm-mini"

[tool.comfy]
PublisherId = "tonylee"
DisplayName = "ComfyUI LLM Mini"
Icon = ""

[tool.black]
line-length = 120
